<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grade Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Student Grade Calculator</h1>
            <p>Enter marks for five subjects to calculate your result</p>
        </div>


        <div class="calculator">

            <div class="student-info">

                <label>Student Name</label>
                <input type="text" id="studentName"
                       placeholder="Enter student name">

            </div>


            <h2>Enter Subject Marks</h2>


            <div class="subjects">

                <div class="subject">
                    <label>Subject 1</label>
                    <input type="number" id="mark1"
                           min="0" max="100"
                           placeholder="0 - 100">
                </div>


                <div class="subject">
                    <label>Subject 2</label>
                    <input type="number" id="mark2"
                           min="0" max="100"
                           placeholder="0 - 100">
                </div>


                <div class="subject">
                    <label>Subject 3</label>
                    <input type="number" id="mark3"
                           min="0" max="100"
                           placeholder="0 - 100">
                </div>


                <div class="subject">
                    <label>Subject 4</label>
                    <input type="number" id="mark4"
                           min="0" max="100"
                           placeholder="0 - 100">
                </div>


                <div class="subject">
                    <label>Subject 5</label>
                    <input type="number" id="mark5"
                           min="0" max="100"
                           placeholder="0 - 100">
                </div>

            </div>


            <button onclick="calculateResult()">
                Calculate Result
            </button>


            <button class="reset" onclick="resetForm()">
                Reset
            </button>


            <div id="result" class="result">

                <h2>Student Result</h2>

                <p>
                    <strong>Name:</strong>
                    <span id="displayName"></span>
                </p>

                <div class="result-box">

                    <div>
                        <span>Total</span>
                        <strong id="total"></strong>
                    </div>

                    <div>
                        <span>Average</span>
                        <strong id="average"></strong>
                    </div>

                    <div>
                        <span>Grade</span>
                        <strong id="grade"></strong>
                    </div>

                    <div>
                        <span>Status</span>
                        <strong id="status"></strong>
                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
